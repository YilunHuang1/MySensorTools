[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-sensor-tools"
version = "0.2.0"
description = "Sensor analysis tools for ROS CDR and Aorta MCAP data"
requires-python = ">=3.10"
dependencies = ["mcap>=1.2", "mcap-ros2-support>=0.5", "pyyaml>=6"]

[project.optional-dependencies]
analysis = ["numpy>=1.24", "pandas>=2", "matplotlib>=3.9", "scipy>=1.10", "seaborn>=0.12", "pyyaml>=6", "opencv-python>=4.8", "scikit-learn>=1.3", "rosbags>=0.10", "laspy>=2.5"]
device = ["pyserial>=3.5", "bleak>=0.22"]
infrared = ["pupil-apriltags>=1.0.4.post11", "opencv-python>=4.8", "numpy>=1.24"]
test = ["pytest>=8", "flatbuffers>=24"]

[tool.setuptools.packages.find]
include = ["sensor_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
